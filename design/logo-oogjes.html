<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logo-oogjes</title>
<style>body{margin:0;padding:16px;background:#fff;font-family:system-ui,sans-serif;color:#1a1414}canvas{width:100%;max-width:1100px;height:auto;border-radius:12px;display:block}</style></head><body>
<canvas id="cv" width="1320" height="760"></canvas>
<script>
(function(){
const INK='#1a1414', SKIN='#FFF4EA';
let ctx;
const ink=(w=1.1)=>{ ctx.strokeStyle=INK; ctx.lineWidth=w; ctx.lineJoin='round'; ctx.lineCap='round'; };
const circ=(x,y,r,fill,stroke=true)=>{ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=fill; ctx.fill(); if(stroke){ ink(); ctx.stroke(); } };
const ell=(x,y,rx,ry,rot,fill,stroke=true)=>{ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot,0,7); ctx.fillStyle=fill; ctx.fill(); if(stroke){ ink(); ctx.stroke(); } };
const seg=(ax,ay,bx,by,col,w)=>{ ink(w+1.6); ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); ctx.strokeStyle=col; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); };

/* ---------- face parts ---------- */
function logoEye(x,y,s,rot,lk){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.save(); ctx.rotate(rot); ell(0,0,4.2,6,0,'#fff'); ctx.restore();
  circ(-rot*6+lk.x*1.6,2.4+lk.y*1.4,1.5,INK,false); circ(-rot*6+lk.x*1.6-0.5,1.9+lk.y*1.4,0.5,'#fff',false);
  const sd=Math.sign(rot)||1; ink(0.8); for(let k=0;k<3;k++){ const a=(sd>0?0.15:Math.PI-0.15)+sd*k*0.38, bx=sd*3.8, by=3; ctx.beginPath(); ctx.moveTo(bx,by+k*0.9); ctx.lineTo(bx+Math.cos(a)*2.1,by+k*0.9+Math.sin(a)*2.1); ctx.stroke(); }
  ctx.restore(); }
function brow(x,y,s,rot){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.rotate(rot); ctx.fillStyle=INK; ctx.beginPath(); ctx.moveTo(-3.4,0.8); ctx.quadraticCurveTo(0,-3,3.4,0.8); ctx.quadraticCurveTo(0,-1,-3.4,0.8); ctx.fill(); ctx.restore(); }
function closedEye(x,y,r,up){ ink(1.3); ctx.beginPath(); if(up) ctx.arc(x,y+r*0.6,r,Math.PI*1.15,Math.PI*1.85); else ctx.arc(x,y-r*0.6,r,Math.PI*0.15,Math.PI*0.85); ctx.stroke(); }
function jSmile(x,y,s,rot=0){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s); const p=()=>{ ctx.beginPath(); ctx.moveTo(2.4,-3); ctx.lineTo(2.4,0.4); ctx.quadraticCurveTo(2.4,3.4,-0.6,3.2); ctx.quadraticCurveTo(-3,3,-3.2,0.8); };
  ctx.lineCap='round'; ctx.strokeStyle='#7a0000'; ctx.lineWidth=3; p(); ctx.stroke(); ctx.strokeStyle='#D20000'; ctx.lineWidth=1.6; p(); ctx.stroke(); ctx.restore(); }
function nose(x,y,r){ const g=ctx.createRadialGradient(x-r*0.4,y-r*0.4,0.3,x,y,r); g.addColorStop(0,'#FF6B6B'); g.addColorStop(0.6,'#D20000'); g.addColorStop(1,'#9E0000'); circ(x,y,r,g); circ(x-r*0.38,y-r*0.38,r*0.28,'rgba(255,255,255,.85)',false); }
const cheeks=(x,y,r,a=.7)=>{ circ(x-7,y,r,`rgba(247,141,167,${a})`,false); circ(x+7,y,r,`rgba(247,141,167,${a})`,false); };

// every face is drawn around (x, y) = head centre; face = looking direction
const FACES={
  logo:{name:'Logo-ogen + J',draw(x,y,f,lk){ cheeks(x,y+4.5,1.8); logoEye(x-2,y-4.6,0.6,-0.18,lk); logoEye(x+2.2,y-4.6,0.6,0.18,lk); brow(x-3,y-9.6,0.6,-0.35); brow(x+3.2,y-9.6,0.6,0.35); const J=window.CLOWN_J||{deg:40,dx:0.6,dy:0}; jSmile(x+f*J.dx,y+6.9+J.dy,0.72,f*J.deg*Math.PI/180); nose(x+0.2,y+2.1,2.9); }}, // J under the nose: tilt (deg) and offset like the logo
  lach:{name:'Lachebek',draw(x,y,f,lk){ cheeks(x,y+3.5,2.4,.8); closedEye(x-3.3,y-3.6,2.3,true); closedEye(x+3.3,y-3.6,2.3,true); brow(x-3.4,y-8.8,0.5,-0.25); brow(x+3.4,y-8.8,0.5,0.25);
    ctx.beginPath(); ctx.moveTo(x-5.4,y+4.6); ctx.quadraticCurveTo(x,y+5.6,x+5.4,y+4.6); ctx.quadraticCurveTo(x+4.6,y+11.8,x,y+11.6); ctx.quadraticCurveTo(x-4.6,y+11.8,x-5.4,y+4.6); ctx.closePath(); ctx.fillStyle='#7a0000'; ctx.fill(); ink(); ctx.stroke();
    ctx.save(); ctx.clip(); ell(x+0.4,y+11,3.4,2.4,0,'#F78DA7',false); ctx.restore(); nose(x+0.2,y+2.1,2.9); }},
  schmink:{name:'Geschminkt',draw(x,y,f,lk){ for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(x+s*3.4,y-11.5); ctx.lineTo(x+s*5.6,y-4.4); ctx.lineTo(x+s*3.4,y+0.8); ctx.lineTo(x+s*1.2,y-4.4); ctx.closePath(); ctx.fillStyle='#3a7bd5'; ctx.fill(); ink(0.7); ctx.stroke();
      ell(x+s*3.4,y-4.4,1.7,2.2,0,'#fff'); circ(x+s*3.4+lk.x*0.6,y-4+lk.y*0.5,0.9,INK,false); }
    ctx.beginPath(); ctx.moveTo(x-7.5,y+4.2); ctx.quadraticCurveTo(x,y+8,x+7.5,y+4.2); ctx.quadraticCurveTo(x+5,y+11.5,x,y+11.3); ctx.quadraticCurveTo(x-5,y+11.5,x-7.5,y+4.2); ctx.fillStyle='#D20000'; ctx.fill(); ink(); ctx.stroke();
    ink(0.9); ctx.beginPath(); ctx.moveTo(x-5.6,y+6.4); ctx.quadraticCurveTo(x,y+9.6,x+5.6,y+6.4); ctx.stroke(); nose(x+0.2,y+1.8,2.7); }},
  knipoog:{name:'Knipoog',draw(x,y,f,lk){ cheeks(x,y+4.5,1.9); const o=f>0?1:-1; logoEye(x+o*2.2,y-4.6,0.6,o*0.18,lk); closedEye(x-o*3,y-3.4,2.3,false);
    brow(x+o*3.2,y-10.4,0.6,o*0.35); brow(x-o*3,y-8.4,0.6,-o*0.1);
    ctx.save(); ctx.translate(x+o*1.6,y+8.6); ctx.rotate(o*0.25); ell(0,0,1.7,2.4,0,'#F78DA7'); ctx.restore(); jSmile(x,y+6.9,0.7); nose(x+0.2,y+2.1,2.9); }},
  lief:{name:'Lief',draw(x,y,f,lk){ cheeks(x,y+3.8,2.6,.75); for(const s of [-1,1]){ const ex=x+s*3.4+lk.x*0.6, ey=y-3.6+lk.y*0.4; circ(ex,ey,2.5,INK,false); circ(ex-0.8,ey-0.9,0.9,'#fff',false); circ(ex+0.7,ey+0.8,0.45,'#fff',false);
      ink(0.8); ctx.beginPath(); ctx.moveTo(ex+s*2,ey-1.6); ctx.lineTo(ex+s*3.3,ey-2.8); ctx.moveTo(ex+s*2.4,ey-0.6); ctx.lineTo(ex+s*3.8,ey-1.2); ctx.stroke(); }
    ink(1.2); ctx.strokeStyle='#D20000'; ctx.beginPath(); ctx.arc(x+0.2,y+5.8,2.6,0.2*Math.PI,0.8*Math.PI); ctx.stroke(); nose(x+0.2,y+1.9,2.4); }},
  grijns:{name:'Grijns',draw(x,y,f,lk){ logoEye(x-2,y-4.9,0.56,-0.18,lk); logoEye(x+2.2,y-4.9,0.56,0.18,lk); brow(x-3,y-10.6,0.6,-0.5); brow(x+3.2,y-10.6,0.6,0.5);
    ctx.beginPath(); ctx.moveTo(x-6.6,y+5); ctx.quadraticCurveTo(x,y+6.4,x+6.6,y+5); ctx.quadraticCurveTo(x,y+12.4,x-6.6,y+5); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#D20000'; ctx.lineWidth=1.6; ctx.stroke(); ink(0.9); ctx.stroke();
    ink(0.6); ctx.beginPath(); ctx.moveTo(x-5.6,y+6.8); ctx.quadraticCurveTo(x,y+8,x+5.6,y+6.8); for(const k of [-3,-1,1,3]){ ctx.moveTo(x+k*1.3,y+5.6); ctx.lineTo(x+k*1.3,y+9.2-Math.abs(k)*0.35); } ctx.stroke(); nose(x+0.2,y+2.1,2.9); }},
};
// shared bits for the cute faces
function bigEye(x,y,r,lk){ const ex=x+lk.x*0.6, ey=y+lk.y*0.4; circ(ex,ey,r,INK,false); circ(ex-r*0.32,ey-r*0.36,r*0.36,'#fff',false); circ(ex+r*0.28,ey+r*0.32,r*0.18,'#fff',false); }
function lashes(x,y,s){ ink(0.8); ctx.beginPath(); ctx.moveTo(x+s*2,y-1.6); ctx.lineTo(x+s*3.3,y-2.8); ctx.moveTo(x+s*2.4,y-0.6); ctx.lineTo(x+s*3.8,y-1.2); ctx.stroke(); }
function openMouth(x,y,w,h,tongue){ ctx.beginPath(); ctx.moveTo(x-w,y); ctx.quadraticCurveTo(x,y+1,x+w,y); ctx.quadraticCurveTo(x+w*0.85,y+h,x,y+h); ctx.quadraticCurveTo(x-w*0.85,y+h,x-w,y); ctx.closePath(); ctx.fillStyle='#7a0000'; ctx.fill(); ink(); ctx.stroke();
  if(tongue){ ctx.save(); ctx.clip(); ell(x+0.3,y+h*0.95,w*0.62,h*0.42,0,'#F78DA7',false); ctx.restore(); } }
function star(x,y,r,col){ ctx.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr2=i%2?r*0.45:r; ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2); } ctx.closePath(); ctx.fillStyle=col; ctx.fill(); ink(0.7); ctx.stroke(); }
function heart(x,y,r,col){ ctx.beginPath(); ctx.moveTo(x,y+r*0.9); ctx.bezierCurveTo(x-r*1.4,y-r*0.1,x-r*0.6,y-r*1.1,x,y-r*0.35); ctx.bezierCurveTo(x+r*0.6,y-r*1.1,x+r*1.4,y-r*0.1,x,y+r*0.9); ctx.fillStyle=col; ctx.fill(); ink(0.7); ctx.stroke(); }
const freckles=(x,y)=>{ for(const s of [-1,1]) for(const [dx,dy] of [[6,0],[7.6,0.9],[6.6,1.9]]) circ(x+s*dx,y+dy,0.35,'#c46a3a',false); };
Object.assign(FACES,{
  lieflach:{name:'Lief + lach',draw(x,y,f,lk){ cheeks(x,y+3.6,2.6,.75); for(const s of [-1,1]){ bigEye(x+s*3.4,y-3.8,2.5,lk); lashes(x+s*3.4,y-3.8,s); } openMouth(x+0.2,y+5,4.6,6,true); nose(x+0.2,y+1.8,2.5); }},
  tevreden:{name:'Tevreden',draw(x,y,f,lk){ cheeks(x,y+3.6,2.6,.8); closedEye(x-3.3,y-3.4,2.3,true); closedEye(x+3.3,y-3.4,2.3,true); for(const s of [-1,1]) lashes(x+s*3.3,y-3.2,s);
    ink(1.3); ctx.strokeStyle='#D20000'; ctx.beginPath(); ctx.arc(x+0.2,y+5.2,3.4,0.15*Math.PI,0.85*Math.PI); ctx.stroke(); nose(x+0.2,y+1.9,2.5); }},
  sterretjes:{name:'Sterretjes',draw(x,y,f,lk){ cheeks(x,y+3.6,2.4,.75); star(x-3.4,y-3.8,3,'#FCB900'); star(x+3.4,y-3.8,3,'#FCB900'); openMouth(x+0.2,y+5,4.4,5.6,true); nose(x+0.2,y+1.8,2.5); }},
  hartjes:{name:'Hartjes',draw(x,y,f,lk){ cheeks(x,y+3.6,2.4,.75); heart(x-3.4,y-3.6,2.8,'#D20000'); heart(x+3.4,y-3.6,2.8,'#D20000'); ink(1.2); ctx.strokeStyle='#D20000'; ctx.beginPath(); ctx.arc(x+0.2,y+5.4,3,0.15*Math.PI,0.85*Math.PI); ctx.stroke(); nose(x+0.2,y+1.8,2.5); }},
  tongetje:{name:'Tongetje',draw(x,y,f,lk){ cheeks(x,y+3.6,2.6,.75); for(const s of [-1,1]){ bigEye(x+s*3.4,y-3.8,2.5,lk); lashes(x+s*3.4,y-3.8,s); }
    ink(1.2); ctx.strokeStyle='#D20000'; ctx.beginPath(); ctx.arc(x+0.2,y+5,3,0.12*Math.PI,0.88*Math.PI); ctx.stroke(); ctx.save(); ctx.translate(x+(f>0?1.4:-1),y+8); ell(0,0,1.6,2.2,0,'#F78DA7'); ink(0.6); ctx.beginPath(); ctx.moveTo(0,-1.4); ctx.lineTo(0,0.6); ctx.stroke(); ctx.restore(); nose(x+0.2,y+1.8,2.5); }},
  giechel:{name:'Giechel',draw(x,y,f,lk){ cheeks(x,y+3.4,2.8,.85); closedEye(x-3.3,y-3.4,2.3,true); closedEye(x+3.3,y-3.4,2.3,true);
    ctx.beginPath(); ctx.moveTo(x-3.8,y+5); ctx.lineTo(x+4.2,y+5); ctx.quadraticCurveTo(x+4,y+10.4,x+0.2,y+10.4); ctx.quadraticCurveTo(x-3.6,y+10.4,x-3.8,y+5); ctx.closePath(); ctx.fillStyle='#7a0000'; ctx.fill(); ink(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.fillRect(x-1.2,y+5.2,2.8,1.7); ink(0.5); ctx.strokeRect(x-1.2,y+5.2,2.8,1.7); nose(x+0.2,y+1.8,2.5); }},
  verbaasd:{name:'Verbaasd',draw(x,y,f,lk){ cheeks(x,y+3.6,2.2,.6); for(const s of [-1,1]){ bigEye(x+s*3.4,y-4.2,2.7,lk); lashes(x+s*3.4,y-4.2,s); } ell(x+0.2,y+7,1.9,2.5,0,'#7a0000'); nose(x+0.2,y+1.8,2.5); }},
  liefknip:{name:'Lief knipoog',draw(x,y,f,lk){ cheeks(x,y+3.6,2.6,.75); const o=f>0?1:-1; bigEye(x+o*3.4,y-3.8,2.5,lk); lashes(x+o*3.4,y-3.8,o); closedEye(x-o*3.3,y-3.4,2.3,true);
    openMouth(x+0.2,y+5,3.8,4.6,true); nose(x+0.2,y+1.8,2.5); }},
  sproetjes:{name:'Sproetjes',draw(x,y,f,lk){ cheeks(x,y+3.4,2.4,.6); freckles(x,y+2.6); closedEye(x-3.3,y-3.4,2.3,true); closedEye(x+3.3,y-3.4,2.3,true); openMouth(x+0.2,y+5,4.8,6.2,true); nose(x+0.2,y+1.8,2.6); }},
  breed:{name:'Brede lach',draw(x,y,f,lk){ cheeks(x,y+3,2.6,.8); for(const s of [-1,1]){ bigEye(x+s*3.4,y-3.8,2.3,lk); lashes(x+s*3.4,y-3.8,s); }
    ctx.beginPath(); ctx.moveTo(x-6,y+4.4); ctx.quadraticCurveTo(x,y+5.6,x+6,y+4.4); ctx.quadraticCurveTo(x+4.6,y+10.6,x,y+10.6); ctx.quadraticCurveTo(x-4.6,y+10.6,x-6,y+4.4); ctx.closePath(); ctx.fillStyle='#7a0000'; ctx.fill(); ink(); ctx.stroke();
    ctx.save(); ctx.clip(); ctx.fillStyle='#fff'; ctx.fillRect(x-6,y+4,12,1.9); ell(x+0.3,y+10.4,3.4,2.2,0,'#F78DA7',false); ctx.restore(); nose(x+0.2,y+1.8,2.6); }},
});

// logo eyes combined with the cute mouths
const LE=(x,y,lk,brows,raise=0)=>{ logoEye(x-2,y-4.6-raise,0.6,-0.18,lk); logoEye(x+2.2,y-4.6-raise,0.6,0.18,lk); if(brows){ brow(x-3,y-9.8-raise,0.56,-0.3); brow(x+3.2,y-9.8-raise,0.56,0.3); } };
const smallSmile=(x,y,r)=>{ ink(1.3); ctx.strokeStyle='#D20000'; ctx.beginPath(); ctx.arc(x,y,r,0.15*Math.PI,0.85*Math.PI); ctx.stroke(); };
Object.assign(FACES,{
  logolach:{name:'Logo + lach',draw(x,y,f,lk){ cheeks(x,y+3.8,2.4,.75); LE(x,y,lk,true); openMouth(x+0.2,y+5,4.6,6,true); nose(x+0.2,y+1.9,2.6); }},
  logolachkaal:{name:'Logo + lach, geen wenkbrauwen',draw(x,y,f,lk){ cheeks(x,y+3.8,2.4,.75); LE(x,y,lk,false); openMouth(x+0.2,y+5,4.6,6,true); nose(x+0.2,y+1.9,2.6); }},
  logoglim:{name:'Logo + glimlachje',draw(x,y,f,lk){ cheeks(x,y+3.8,2.4,.75); LE(x,y,lk,false); smallSmile(x+0.2,y+5.2,3.2); nose(x+0.2,y+1.9,2.5); }},
  logotong:{name:'Logo + tongetje',draw(x,y,f,lk){ cheeks(x,y+3.8,2.4,.75); LE(x,y,lk,false); smallSmile(x+0.2,y+5,3); ctx.save(); ctx.translate(x+(f>0?1.4:-1),y+8); ell(0,0,1.6,2.2,0,'#F78DA7'); ink(0.6); ctx.beginPath(); ctx.moveTo(0,-1.4); ctx.lineTo(0,0.6); ctx.stroke(); ctx.restore(); nose(x+0.2,y+1.9,2.5); }},
  logoverbaasd:{name:'Logo + verbaasd',draw(x,y,f,lk){ cheeks(x,y+3.8,2.1,.6); LE(x,y,{x:lk.x*0.3,y:-0.6},true,1); ell(x+0.2,y+7.2,1.9,2.6,0,'#7a0000'); nose(x+0.2,y+1.9,2.5); }},
  logobreed:{name:'Logo + brede lach',draw(x,y,f,lk){ cheeks(x,y+3.2,2.5,.8); LE(x,y,lk,false);
    ctx.beginPath(); ctx.moveTo(x-6,y+4.4); ctx.quadraticCurveTo(x,y+5.6,x+6,y+4.4); ctx.quadraticCurveTo(x+4.6,y+10.6,x,y+10.6); ctx.quadraticCurveTo(x-4.6,y+10.6,x-6,y+4.4); ctx.closePath(); ctx.fillStyle='#7a0000'; ctx.fill(); ink(); ctx.stroke();
    ctx.save(); ctx.clip(); ctx.fillStyle='#fff'; ctx.fillRect(x-6,y+4,12,1.9); ell(x+0.3,y+10.4,3.4,2.2,0,'#F78DA7',false); ctx.restore(); nose(x+0.2,y+1.8,2.6); }},
  logogiechel:{name:'Logo + giechel',draw(x,y,f,lk){ cheeks(x,y+3.6,2.7,.85); LE(x,y,lk,false);
    ctx.beginPath(); ctx.moveTo(x-3.8,y+5); ctx.lineTo(x+4.2,y+5); ctx.quadraticCurveTo(x+4,y+10.4,x+0.2,y+10.4); ctx.quadraticCurveTo(x-3.6,y+10.4,x-3.8,y+5); ctx.closePath(); ctx.fillStyle='#7a0000'; ctx.fill(); ink(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.fillRect(x-1.2,y+5.2,2.8,1.7); ink(0.5); ctx.strokeRect(x-1.2,y+5.2,2.8,1.7); nose(x+0.2,y+1.8,2.5); }},
  logosproet:{name:'Logo + sproetjes',draw(x,y,f,lk){ cheeks(x,y+3.4,2.3,.6); freckles(x,y+2.8); LE(x,y,lk,false); openMouth(x+0.2,y+5,4.6,6,true); nose(x+0.2,y+1.8,2.6); }},
  logoknip:{name:'Logo-knipoog + lach',draw(x,y,f,lk){ cheeks(x,y+3.8,2.4,.75); const o=f>0?1:-1; logoEye(x+o*2.2,y-4.6,0.6,o*0.18,lk); closedEye(x-o*3,y-3.6,2.3,true); openMouth(x+0.2,y+5,4.2,5.4,true); nose(x+0.2,y+1.8,2.5); }},
  logoj:{name:'Logo + J-lachje',draw(x,y,f,lk){ cheeks(x,y+4.2,2.4,.75); LE(x,y,lk,false); jSmile(x+f*3,y+7.2,0.7,f*0.6); nose(x+0.2,y+2,2.7); }},
});

/* ---------- body ---------- */
// Straight legs, no knees. Walking: each foot is planted and slides back (stance), then swings
// forward in a small arc. Jumping: pass air:true + vy (negative = going up); squash 0..1 crouches
// before take-off and after landing.
const STRIDE=8, LIFT=3, ANKLE=2.2, HIP=-13.4, RAISE=-1.8;
const smooth=t=>t*t*(3-2*t), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), mix=(a,b,k)=>a+(b-a)*k;
function footAt(q){ q=((q%1)+1)%1;
  if(q<0.6){ const t=q/0.6; return {x:STRIDE/2-STRIDE*t, y:0, roll:t>0.75?(t-0.75)*1.6:0}; }
  const t=(q-0.6)/0.4; return {x:-STRIDE/2+STRIDE*smooth(t), y:-LIFT*Math.sin(Math.PI*t), roll:0.35*Math.sin(Math.PI*t)}; }
function legTo(hx,hy,fx,fy,roll,face,back){ seg(hx,hy,fx,fy,back?'#2a5ca8':'#3a7bd5',2.6);
