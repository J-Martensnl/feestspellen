<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feestrun poppetjes</title>
<style>body{margin:0;padding:16px;background:#fff;font-family:system-ui,sans-serif;color:#1a1414}canvas{width:100%;max-width:1100px;height:auto;border-radius:12px;display:block}button{margin:10px 8px 0 0;padding:8px 14px;border:2px solid #D20000;background:#fff;color:#D20000;border-radius:20px;font-weight:700;cursor:pointer}</style></head><body>
<canvas id="cv" width="1360" height="660"></canvas>
<button id="bWalk">Laat ze lopen</button><button id="bNight">Nachtversie</button>
<script>
// Character sketches: origin = feet on the ground, centre. ~48 units tall. face = 1 (right) / -1 (left).
function makePoppetjes(ctx){
const INK='#1a1414';
const ink=(w=1.1)=>{ ctx.strokeStyle=INK; ctx.lineWidth=w; ctx.lineJoin='round'; ctx.lineCap='round'; };
const circ=(x,y,r,fill,stroke=true)=>{ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=fill; ctx.fill(); if(stroke){ ink(); ctx.stroke(); } };
const ell=(x,y,rx,ry,rot,fill,stroke=true)=>{ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot,0,7); ctx.fillStyle=fill; ctx.fill(); if(stroke){ ink(); ctx.stroke(); } };
function eyes(cx,cy,s,lk,brows){ ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s);
  const E=[{x:-3.5,r:-0.18},{x:3.5,r:0.18}];
  for(const e of E){ ctx.save(); ctx.translate(e.x,0); ctx.rotate(e.r); ell(0,0,4.2,6,0,'#fff'); ctx.restore(); }
  for(const e of E){ circ(e.x*0.55+lk.x*1.6,2.4+lk.y*1.4,1.45,INK,false); circ(e.x*0.55+lk.x*1.6-0.5,1.9+lk.y*1.4,0.45,'#fff',false); }
  ink(0.8); for(const sd of [-1,1]){ const bx=sd*7.2, by=3; for(let k=0;k<3;k++){ const a=(sd>0?0.15:Math.PI-0.15)+sd*k*0.38; ctx.beginPath(); ctx.moveTo(bx,by+k*0.9); ctx.lineTo(bx+Math.cos(a)*2.1,by+k*0.9+Math.sin(a)*2.1); ctx.stroke(); } }
  if(brows){ ctx.fillStyle=INK; for(const sd of [-1,1]){ ctx.save(); ctx.translate(sd*5,-8.4); ctx.rotate(sd*0.35); ctx.beginPath(); ctx.moveTo(-3.4,0.8); ctx.quadraticCurveTo(0,-3,3.4,0.8); ctx.quadraticCurveTo(0,-1,-3.4,0.8); ctx.fill(); ctx.restore(); } }
  ctx.restore(); }
function jSmile(cx,cy,s,col,edge){ ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s); const p=()=>{ ctx.beginPath(); ctx.moveTo(2.4,-3); ctx.lineTo(2.4,0.4); ctx.quadraticCurveTo(2.4,3.4,-0.6,3.2); ctx.quadraticCurveTo(-3,3,-3.2,0.8); };
  ctx.lineCap='round'; ctx.strokeStyle=edge; ctx.lineWidth=3; p(); ctx.stroke(); ctx.strokeStyle=col; ctx.lineWidth=1.6; p(); ctx.stroke(); ctx.restore(); }
function nose(x,y,r){ const g=ctx.createRadialGradient(x-r*0.4,y-r*0.4,0.3,x,y,r); g.addColorStop(0,'#FF6B6B'); g.addColorStop(0.6,'#D20000'); g.addColorStop(1,'#9E0000'); circ(x,y,r,g); circ(x-r*0.38,y-r*0.38,r*0.28,'rgba(255,255,255,.85)',false); }
function legs(hipY,walk,a,legCol,shoeCol,face,big){ const sw=walk?Math.sin(a*0.32):0;
  for(const s of [-1,1]){ const hx=s*2.6, fx=hx+s*sw*4.5*face*s, lift=walk?Math.max(0,-s*sw)*2.2:0;
    ink(3.4); ctx.beginPath(); ctx.moveTo(hx,hipY); ctx.lineTo(fx,-2.6-lift); ctx.stroke();
    ctx.strokeStyle=legCol; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(hx,hipY); ctx.lineTo(fx,-2.6-lift); ctx.stroke();
    ell(fx+face*(big?2.6:1.6),-2.2-lift,big?4.6:3.3,2.3,0,shoeCol); } }
function arms(sy,walk,a,sleeve,face,up){ const sw=walk?Math.sin(a*0.32):0;
  for(const s of [-1,1]){ const sx=s*6.2, hx=s*10.5-sw*s*2.5, hy=sy+(up?-6:5)+sw*s*1.5;
    ink(3.2); ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(hx,hy); ctx.stroke(); ctx.strokeStyle=sleeve; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(hx,hy); ctx.stroke();
    circ(hx,hy,2.3,'#fff'); } }
function ruffle(y,r,col){ for(let k=0;k<7;k++){ const ang=Math.PI*(0.08+k*0.84/6); circ(Math.cos(ang)*r*-1,y+Math.sin(ang)*1.2,2.2,k%2?col:'#fff'); } }
function hat(x,y,face){ ctx.save(); ctx.translate(x,y); ctx.rotate(face*0.3); ctx.beginPath(); ctx.moveTo(-5.5,2); ctx.lineTo(5.5,2); ctx.lineTo(0,-11); ctx.closePath(); ctx.fillStyle='#FCB900'; ctx.fill(); ink(); ctx.stroke();
  ctx.strokeStyle='#D20000'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(-3.6,-2.5); ctx.lineTo(3,-1); ctx.moveTo(-1.6,-7); ctx.lineTo(2,-6); ctx.stroke(); circ(0,-11.5,2,'#D20000'); ctx.restore(); }
function hairTufts(x,y,col,face){ for(const s of [-1,1]) for(let k=0;k<3;k++) circ(s*(10.5+k*0.6)+face*0.5,y-4+k*3.4,2.8,col); }

const C={
  clown(face,a,lk,walk){ // Clowntje: white face, logo eyes, red nose, red J smile, orange hair, polka-dot suit
    legs(-12,walk,a,'#3a7bd5','#D20000',face,true);
    ctx.beginPath(); ctx.moveTo(-6.5,-24); ctx.quadraticCurveTo(-9.5,-12,-6,-10); ctx.lineTo(6,-10); ctx.quadraticCurveTo(9.5,-12,6.5,-24); ctx.closePath(); ctx.fillStyle='#D20000'; ctx.fill(); ink(); ctx.stroke();
    for(const [dx,dy] of [[-3,-20],[2.5,-17],[-1,-13.5],[4,-22],[-4.5,-15]]) circ(dx,dy,1.1,'#fff',false);
    circ(0,-19,1.2,'#FCB900'); circ(0,-14.5,1.2,'#FCB900');
    arms(-21,walk,a,'#D20000',face,false);
    ruffle(-24,7,'#8ED1FC');
    hairTufts(0,-36,'#FF8A1F',face);
    circ(face*0.6,-35.5,11,'#FFF4EA');
    circ(face*1-7,-31,1.8,'rgba(247,141,167,.7)',false); circ(face*1+7,-31,1.8,'rgba(247,141,167,.7)',false);
    eyes(face*1.6,-40.2,0.6,lk,true);
    jSmile(face*1.6,-28.6,0.7,'#D20000','#7a0000');
    nose(face*1.8,-33.4,2.9);
    hat(face*1.5,-46.5,face);
  },
  clownmeisje(face,a,lk,walk){ // Clownmeisje: pigtails, bow, dress
    legs(-11,walk,a,'#fff','#9B51E0',face,false);
    ctx.beginPath(); ctx.moveTo(-5,-24); ctx.lineTo(-10,-10); ctx.quadraticCurveTo(0,-7.5,10,-10); ctx.lineTo(5,-24); ctx.closePath(); ctx.fillStyle='#F78DA7'; ctx.fill(); ink(); ctx.stroke();
    for(const [dx,dy] of [[-4,-14],[0,-17],[4,-13],[-1.5,-11.5],[2,-21]]) circ(dx,dy,1.1,'#fff',false);
    arms(-21,walk,a,'#F78DA7',face,false);
    ruffle(-24,6.5,'#FCB900');
    for(const s of [-1,1]){ ell(s*13+face*0.4,-36.5,3.4,5.4,s*0.5,'#9B51E0'); circ(s*10.6,-40,1.6,'#FCB900'); }
    circ(face*0.6,-35.5,11,'#FFF4EA');
    ctx.fillStyle='#9B51E0'; ctx.beginPath(); ctx.arc(face*0.6,-36.5,11.3,Math.PI*1.08,Math.PI*1.92); ctx.quadraticCurveTo(face*0.6,-40,face*0.6-10.6,-40); ctx.fill(); ink(); ctx.stroke();
    circ(face*1-7,-31,1.9,'rgba(247,141,167,.8)',false); circ(face*1+7,-31,1.9,'rgba(247,141,167,.8)',false);
    eyes(face*1.6,-38.6,0.58,lk,false);
    jSmile(face*1.6,-28.6,0.7,'#D20000','#7a0000');
    nose(face*1.8,-33,2.7);
    ctx.save(); ctx.translate(face*1.5,-48); for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(s*6,-3.5); ctx.lineTo(s*6,3.5); ctx.closePath(); ctx.fillStyle='#D20000'; ctx.fill(); ink(); ctx.stroke(); } circ(0,0,1.8,'#D20000'); ctx.restore();
  },
  ballonpop(face,a,lk,walk){ // Ballonpoppetje: the red balloon is the head, rubber-hose limbs, sneakers
    legs(-14,walk,a,INK,'#D20000',face,false);
    ctx.beginPath(); ctx.moveTo(-4,-23); ctx.quadraticCurveTo(-5,-14,-3,-13); ctx.lineTo(3,-13); ctx.quadraticCurveTo(5,-14,4,-23); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ink(); ctx.stroke();
    ctx.fillStyle='#D20000'; ctx.font='900 6px Grandstander, Impact, sans-serif'; ctx.textAlign='center'; ctx.fillText('J',0,-15.5); ctx.textAlign='left';
    arms(-21,walk,a,INK,face,false);
    ctx.fillStyle='#9E0000'; ctx.beginPath(); ctx.moveTo(-2.4,-23); ctx.lineTo(2.4,-23); ctx.lineTo(0,-26); ctx.closePath(); ctx.fill();
    const g=ctx.createRadialGradient(-5*face,-41,1.5,0,-36,14); g.addColorStop(0,'#FF6B6B'); g.addColorStop(0.55,'#D20000'); g.addColorStop(1,'#9E0000');
    ctx.beginPath(); ctx.ellipse(0,-36,11.5,12.5,0,0,7); ctx.fillStyle=g; ctx.fill(); ink(); ctx.stroke();
    ell(-5*face,-42,2.6,3.8,face*0.5,'rgba(255,255,255,.55)',false);
    eyes(face*2,-38,0.66,lk,true);
    jSmile(face*2,-29.6,0.78,'#fff','#5a0000');
  },
  neus(face,a,lk,walk){ // Neusmannetje: the logo's red nose with the logo eyes on top, gloves and shoes
    legs(-8,walk,a,INK,'#FCB900',face,true);
    arms(-17,walk,a,INK,face,true);
    const g=ctx.createRadialGradient(-4*face,-24,1.5,0,-18,14); g.addColorStop(0,'#FF6B6B'); g.addColorStop(0.55,'#D20000'); g.addColorStop(1,'#9E0000');
    ctx.beginPath(); ctx.ellipse(0,-18,12,11,0,0,7); ctx.fillStyle=g; ctx.fill(); ink(); ctx.stroke();
    ell(-4.5*face,-23,3,2.2,-0.4,'rgba(255,255,255,.85)',false);
    jSmile(face*2.5,-13.5,0.9,'#fff','#5a0000');
    eyes(face*1.4,-33,0.95,lk,true);
  },
};
return C;
}
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'); const C=makePoppetjes(ctx);
let night=false, walk=false;
const K=['clown','clownmeisje','ballonpop','neus'], LBL=['Clowntje','Clownmeisje','Ballonpoppetje','Neusmannetje'];
function frame(t){ const a=t/16.7; ctx.fillStyle=night?'#1a0a0e':'#FFF6F3'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle=night?'#2a1418':'#f1d9d4'; ctx.fillRect(0,425,cv.width,6); ctx.fillRect(0,585,cv.width,4);
  const lk={x:Math.sin(a*0.02)*1.2,y:Math.sin(a*0.013+1)*0.9}, col=cv.width/4;
  K.forEach((k,v)=>{ const cx=col*v+col/2, bob=walk?Math.abs(Math.sin(a*0.32))*-6:0;
    ctx.save(); ctx.translate(cx,425+bob); ctx.scale(6.6,6.6); C[k](1,a,lk,walk); ctx.restore();
    ctx.save(); ctx.translate(cx-40,585); ctx.scale(1.15,1.15); C[k](1,a,lk,walk); ctx.restore();
    ctx.save(); ctx.translate(cx+40,585); ctx.scale(1.15,1.15); C[k](-1,a,{x:-lk.x,y:lk.y},walk); ctx.restore();
    ctx.fillStyle=night?'#f3dede':'#1A1414'; ctx.font='600 24px system-ui,sans-serif'; ctx.textAlign='center'; ctx.fillText(LBL[v],cx,640); });
  ctx.fillStyle=night?'#c9a9a9':'#5a4444'; ctx.font='400 18px system-ui,sans-serif'; ctx.textAlign='left'; ctx.fillText('groot',14,30); ctx.fillText('op spelformaat',14,470);
  requestAnimationFrame(frame); }
requestAnimationFrame(frame);
document.getElementById('bWalk').onclick=e=>{ walk=!walk; e.target.textContent=walk?'Stilstaan':'Laat ze lopen'; };
document.getElementById('bNight').onclick=e=>{ night=!night; e.target.textContent=night?'Dagversie':'Nachtversie'; };
</script></body></html>
