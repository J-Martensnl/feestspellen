<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clowntje in flappy en snake</title>
<style>body{margin:0;padding:16px;background:#fff;font-family:system-ui,sans-serif;color:#1a1414}canvas{width:100%;max-width:1100px;height:auto;border-radius:12px;display:block}</style></head><body>
<canvas id="cv" width="1360" height="720"></canvas>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const CLOWN=(()=>{
  const INK='#1a1414', SKIN='#FFF4EA', STRIDE=8, LIFT=3, ANKLE=2.2, HIP=-13.4, RAISE=-1.8;
  const ink=(w=1.1)=>{ ctx.strokeStyle=INK; ctx.lineWidth=w; ctx.lineJoin='round'; ctx.lineCap='round'; };
  const circ=(x,y,r,fill,stroke=true)=>{ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=fill; ctx.fill(); if(stroke){ ink(); ctx.stroke(); } };
  const ell=(x,y,rx,ry,rot,fill,stroke=true)=>{ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot,0,7); ctx.fillStyle=fill; ctx.fill(); if(stroke){ ink(); ctx.stroke(); } };
  const seg=(ax,ay,bx,by,col,w)=>{ ink(w+1.6); ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); ctx.strokeStyle=col; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); };
  const smooth=t=>t*t*(3-2*t), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), mix=(a,b,k)=>a+(b-a)*k;
  function logoEye(x,y,s,rot,lk){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.save(); ctx.rotate(rot); ell(0,0,4.2,6,0,'#fff'); ctx.restore();
    circ(-rot*6+lk.x*1.6,2.4+lk.y*1.4,1.5,INK,false); circ(-rot*6+lk.x*1.6-0.5,1.9+lk.y*1.4,0.5,'#fff',false);
    const sd=Math.sign(rot)||1; ink(0.8); for(let k=0;k<3;k++){ const a=(sd>0?0.15:Math.PI-0.15)+sd*k*0.38, bx=sd*3.8, by=3; ctx.beginPath(); ctx.moveTo(bx,by+k*0.9); ctx.lineTo(bx+Math.cos(a)*2.1,by+k*0.9+Math.sin(a)*2.1); ctx.stroke(); }
    ctx.restore(); }
  function nose(x,y,r){ const g=ctx.createRadialGradient(x-r*0.4,y-r*0.4,0.3,x,y,r); g.addColorStop(0,'#FF6B6B'); g.addColorStop(0.6,'#D20000'); g.addColorStop(1,'#9E0000'); circ(x,y,r,g); circ(x-r*0.38,y-r*0.38,r*0.28,'rgba(255,255,255,.85)',false); }
  function face(x,y,lk){ circ(x-7,y+3.8,2.4,'rgba(247,141,167,.75)',false); circ(x+7,y+3.8,2.4,'rgba(247,141,167,.75)',false);
    logoEye(x-2,y-4.6,0.6,-0.18,lk); logoEye(x+2.2,y-4.6,0.6,0.18,lk);
    ink(1.3); ctx.strokeStyle='#D20000'; ctx.beginPath(); ctx.arc(x+0.2,y+5.2,3.2,0.15*Math.PI,0.85*Math.PI); ctx.stroke(); nose(x+0.2,y+1.9,2.5); }
  function footAt(q){ q=((q%1)+1)%1;
    if(q<0.6){ const t=q/0.6; return {x:STRIDE/2-STRIDE*t, y:0, roll:t>0.75?(t-0.75)*1.6:0}; }
    const t=(q-0.6)/0.4; return {x:-STRIDE/2+STRIDE*smooth(t), y:-LIFT*Math.sin(Math.PI*t), roll:0.35*Math.sin(Math.PI*t)}; }
  function legTo(hx,hy,fx,fy,roll,f,back){ seg(hx,hy,fx,fy,back?'#2a5ca8':'#3a7bd5',2.6);
    ctx.save(); ctx.translate(fx,fy); ctx.rotate(-f*roll); ell(f*2.5,-0.1,4.8,2.3,0,back?'#a30000':'#D20000'); ell(f*3.6,-1,1.4,0.7,f*0.3,'rgba(255,255,255,.55)',false); ctx.restore(); }
  function armTo(sx,sy,hx,hy,back){ seg(sx,sy,hx,hy,back?'#a30000':'#D20000',2.4); circ(hx,hy,2.3,back?'#e9e4e0':'#fff'); }
  function hat(x,y,f){ ctx.save(); ctx.translate(x,y); ctx.rotate(f*0.3); ctx.beginPath(); ctx.moveTo(-5.5,2); ctx.lineTo(5.5,2); ctx.lineTo(0,-11); ctx.closePath(); ctx.fillStyle='#FCB900'; ctx.fill(); ink(); ctx.stroke();
    ctx.strokeStyle='#D20000'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(-3.6,-2.5); ctx.lineTo(3,-1); ctx.moveTo(-1.6,-7); ctx.lineTo(2,-6); ctx.stroke(); circ(0,-11.5,2,'#D20000'); ctx.restore(); }
  const hero=function(x0,y0,S,o){ const f=o.face||1, p=o.p||0, air=!!o.air, walking=!!o.walking&&!air, lk=o.lk||{x:0.6,y:0.5}, t=o.t||0;
    const vy=o.vy||0, sq=clamp(o.squash||0,0,1), k=clamp((vy+3)/6,0,1), st=air?clamp(-vy/8,0,1):0; // k: 0 rising .. 1 falling
    const bob=walking?0.75*Math.cos(4*Math.PI*p)+0.3:air?0:0.35*Math.sin(t*0.05)*(1-sq);
    const lift=air?-st*1.2:0, drop=sq*4.2, hy=HIP+bob+drop+lift, nX=-f*1.6, bX=f*1.6;
    let N,B;
    if(air){ N={x:mix(f*3.8,f*2.2,k),y:hy+mix(6.6,11.6,k),r:mix(0.5,-0.2,k)}; B={x:mix(-f*1,-f*3.2,k),y:hy+mix(9.6,11.2,k),r:mix(0.35,-0.15,k)}; }
    else if(walking){ const fn=footAt(p), fb=footAt(p+0.5); N={x:nX+f*fn.x,y:-ANKLE+fn.y,r:fn.roll}; B={x:bX+f*fb.x,y:-ANKLE+fb.y,r:fb.roll}; }
    else { N={x:nX-f*sq*1.8,y:-ANKLE,r:0}; B={x:bX+f*sq*1.8,y:-ANKLE,r:0}; }
    ctx.save(); ctx.translate(x0,y0); ctx.scale(S,S);
    legTo(bX,hy,B.x,B.y,B.r,f,true); legTo(nX,hy,N.x,N.y,N.r,f,false);
    ctx.translate(0,bob+RAISE+drop+lift); ctx.translate(0,HIP); ctx.scale(1+0.12*sq-0.06*st,1-0.13*sq+0.1*st); ctx.translate(0,-HIP);
    ctx.rotate(walking?f*0.05:air?f*mix(-0.04,0.06,k):-f*0.06*sq);
    const SY=-21.2, hand=(s,ang)=>({x:s*5.6+Math.sin(ang)*6.6*f,y:SY+Math.cos(ang)*6.6});
    let hB,hN;
    if(air){ const w=Math.sin(t*0.5)*1.6*k; hB={x:f*mix(12.5,12,k),y:mix(-31,-19,k)-w}; hN={x:-f*mix(12.5,12,k),y:mix(-31,-19,k)+w}; }
    else { const sw=walking?Math.cos(2*Math.PI*p)*0.65:0.06*Math.sin(t*0.05), back=-0.8*sq; hB=hand(f,sw+back); hN=hand(-f,-sw+back); }
    if(!air) armTo(f*5.6,SY,hB.x,hB.y,true);
    ctx.beginPath(); ctx.moveTo(-6.5,-24); ctx.quadraticCurveTo(-9.5,-12,-6,-10); ctx.lineTo(6,-10); ctx.quadraticCurveTo(9.5,-12,6.5,-24); ctx.closePath(); ctx.fillStyle='#D20000'; ctx.fill(); ink(); ctx.stroke();
    for(const [dx,dy] of [[-3,-20],[2.5,-17],[-1,-13.5],[4,-22],[-4.5,-15]]) circ(dx,dy,1.1,'#fff',false);
    circ(f*0.4,-19,1.2,'#FCB900'); circ(f*0.4,-14.5,1.2,'#FCB900');
    if(!air) armTo(-f*5.6,SY,hN.x,hN.y,false);
    for(let i=0;i<7;i++){ const a=Math.PI*(0.08+i*0.84/6); circ(-Math.cos(a)*7,-24+Math.sin(a)*1.2,2.2,i%2?'#8ED1FC':'#fff'); }
    if(air){ armTo(f*5.6,SY,hB.x,hB.y,true); armTo(-f*5.6,SY,hN.x,hN.y,false); }
    for(const s of [-1,1]) for(let i=0;i<3;i++) circ(s*(10.5+i*0.6)+f*0.5,-40+i*3.4+(air?mix(1.5,-1.5,k)*(i+1)*0.4:0),2.8,'#FF8A1F');
    circ(f*0.6,-35.5,11,SKIN);
    face(f*1.6,-35.5,air?{x:lk.x,y:mix(-1,1,k)}:lk);
    hat(f*1.5,-46.5+(air?mix(0,-1.2,k):0),f);
    ctx.restore(); };
  // the head on its own, centred on (x0,y0): hair, face, hat. o: {face, lk, rot, hair (lift of the tufts)}
  function headAt(f,lk,hair){ for(const s of [-1,1]) for(let i=0;i<3;i++) circ(s*(10.5+i*0.6)+f*0.5,-4.5+i*3.4-(hair||0)*(i+1)*0.4,2.8,'#FF8A1F');
    circ(f*0.6,0,11,SKIN); face(f*1.6,0,lk); hat(f*1.5,-11,f); }
  const head=function(x0,y0,S,o){ const f=o.face||1; ctx.save(); ctx.translate(x0,y0); ctx.rotate(o.rot||0); ctx.scale(S,S); headAt(f,o.lk||{x:0.6,y:0.5},o.hair); ctx.restore(); };
  // the head as a balloon: (x0,y0) is the knot at the bottom, like drawBalloonHero; the head centre sits 16*S above it
  const headBalloon=function(x0,y0,S,o){ const f=o.face||1, a=o.t||0;
    ctx.save(); ctx.translate(x0,y0); ctx.rotate(o.rot||0); ctx.scale(S,S);
    ctx.strokeStyle='#5a4444'; ctx.lineWidth=1.3; ctx.beginPath(); ctx.moveTo(0,-2); ctx.quadraticCurveTo(-f*3,6,Math.sin(a*0.2)*2,12); ctx.stroke();
    for(let i=0;i<5;i++){ const an=Math.PI*(0.1+i*0.8/4); circ(-Math.cos(an)*4.6,-4.4+Math.sin(an)*0.9,1.7,i%2?'#8ED1FC':'#fff'); }
    ctx.save(); ctx.translate(0,-16); ctx.scale(13/11,13/11); headAt(f,o.lk||{x:0.6,y:0.5},o.hair); ctx.restore();
    ctx.restore(); };
  // a red balloon with the clown face painted on it, plus hair and hat (alternative for flappy)
  const paintedBalloon=function(x0,y0,S,o){ const f=o.face||1, a=o.t||0, lk=o.lk||{x:0.6,y:0.5};
    ctx.save(); ctx.translate(x0,y0); ctx.rotate(o.rot||0); ctx.scale(S,S);
    ctx.strokeStyle='#5a4444'; ctx.lineWidth=1.3; ctx.beginPath(); ctx.moveTo(0,-2); ctx.quadraticCurveTo(-f*3,6,Math.sin(a*0.2)*2,12); ctx.stroke();
    ctx.fillStyle='#9E0000'; ctx.beginPath(); ctx.moveTo(-3,-3); ctx.lineTo(3,-3); ctx.lineTo(0,1); ctx.closePath(); ctx.fill();
    for(const s of [-1,1]) for(let i=0;i<3;i++) circ(s*(12+i*0.5)+f*0.4,-20+i*3.3,2.6,'#FF8A1F');
    const g=ctx.createRadialGradient(-5*f,-22,2,0,-16,16); g.addColorStop(0,'#FF6B6B'); g.addColorStop(0.55,'#D20000'); g.addColorStop(1,'#9E0000');
    ctx.beginPath(); ctx.ellipse(0,-16,13,14.5,0,0,7); ctx.fillStyle=g; ctx.fill(); ink(); ctx.stroke();
    ell(-5*f,-23,3.2,4.6,f*0.5,'rgba(255,255,255,.5)',false);
    logoEye(f*1.6-2,-20,0.62,-0.18,lk); logoEye(f*1.6+2.2,-20,0.62,0.18,lk);
    circ(f*1.6-7,-11.6,2.2,'rgba(255,190,200,.55)',false); circ(f*1.6+7,-11.6,2.2,'rgba(255,190,200,.55)',false);
    ink(1.5); ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.arc(f*1.6+0.2,-10.4,3.4,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    const ng=ctx.createRadialGradient(f*1.6-1,-14.6,0.3,f*1.6+0.2,-13.6,2.8); ng.addColorStop(0,'#FF9A9A'); ng.addColorStop(1,'#B00000'); circ(f*1.6+0.2,-13.6,2.7,ng); circ(f*1.6-0.8,-14.6,0.7,'rgba(255,255,255,.85)',false);
    hat(f*1.5,-29.5,f);
    ctx.restore(); };
  return {hero,head,headBalloon,paintedBalloon};
})();

const SNCOL=['#FCB900','#8ED1FC','#7BDCB5','#9B51E0','#F78DA7','#FF6B6B'];
function balloon(x,y,col,r){ const g=ctx.createRadialGradient(x-r*0.35,y-r*0.4,1,x,y,r*1.2); g.addColorStop(0,'#fff'); g.addColorStop(0.25,col); g.addColorStop(1,col); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y,r,r*1.15,0,0,7); ctx.fill(); }
function label(x,y,t,c){ ctx.fillStyle=c||'#1A1414'; ctx.font='600 24px system-ui,sans-serif'; ctx.textAlign='center'; ctx.fillText(t,x,y); }
let t=0;
function frame(){ t++; const lk={x:0.8,y:Math.sin(t*0.03)*0.8};
  ctx.fillStyle='#FFF6F3'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#f1d9d4'; ctx.fillRect(0,440,cv.width,4);
  const bob=Math.sin(t*0.06)*6, rot=Math.sin(t*0.04)*0.25;
  label(230,40,'Flappy A: hoofdje als ballon'); label(680,40,'Flappy B: ballon met gezichtje'); label(1130,40,'Snake: hoofdje voorop');
  CLOWN.headBalloon(230,330+bob,4.4,{face:1,lk,t,rot,hair:Math.sin(t*0.1)}); CLOWN.paintedBalloon(680,330+bob,4.4,{face:1,lk,t,rot});
  for(let i=6;i>=1;i--){ balloon(1130-i*34,250+Math.sin(t*0.1+i)*4,SNCOL[i%SNCOL.length],22); }
  CLOWN.head(1130+8,240,2.6,{face:1,lk:{x:1,y:0.2}});
  label(230,480,'op spelformaat','#5a4444'); label(680,480,'op spelformaat','#5a4444'); label(1130,480,'op spelformaat','#5a4444');
  CLOWN.headBalloon(230,600+bob*0.3,1.3,{face:1,lk,t,rot}); CLOWN.paintedBalloon(680,600+bob*0.3,1.3,{face:1,lk,t,rot});
  ctx.save(); ctx.translate(1130,580); for(let i=6;i>=1;i--){ const x=-i*22; ctx.save(); ctx.translate(x,Math.sin(t*0.1+i)*1.5); balloon(0,0,SNCOL[i%SNCOL.length],10); ctx.restore(); } ctx.restore();
  CLOWN.head(1136,576,1.15,{face:1,lk:{x:1,y:0.2}});
  requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script></body></html>
